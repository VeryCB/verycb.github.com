<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>My Charts</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
            body {
                background-color: #131722;
            }
            .tradingview-widget-container {
                height: 100vh;
                height: 100dvh;
                display: flex;
            }
            .tradingview-widget-container .section {
                flex: 1;
                display: grid;
                grid-template-columns: 1fr;
                grid-auto-rows: 1fr;
                min-height: 0;
            }
            .tradingview-widget-container .full-chart {
                min-width: 0;
                min-height: 0;
            }
            @media (min-width: 1000px) {
                /* 中等宽度：上排两张并排，ETH/BTC 占满第二行 */
                .tradingview-widget-container .section {
                    grid-template-columns: repeat(2, 1fr);
                    grid-template-rows: repeat(2, 1fr);
                }
                .tradingview-widget-container .full-chart:nth-child(3) {
                    grid-column: span 2;
                }
            }
            @media (min-width: 1800px) {
                /* 超宽屏：三张并排，各占满整列高度 */
                .tradingview-widget-container .section {
                    grid-template-columns: repeat(3, 1fr);
                    grid-template-rows: 1fr;
                }
                .tradingview-widget-container .full-chart:nth-child(3) {
                    grid-column: auto;
                }
            }
        </style>
    </head>
    <body>
        <div class="tradingview-widget-container">
            <div class="section">
                <div id="tradingview_btc" class="full-chart"></div>
                <div id="tradingview_eth" class="full-chart"></div>
                <div id="tradingview_ethbtc" class="full-chart"></div>
            </div>
        </div>

        <script
            type="text/javascript"
            src="https://s3.tradingview.com/tv.js"
        ></script>
        <script type="text/javascript">
            new TradingView.widget({
                autosize: true,
                symbol: "BINANCE:BTCUSDT",
                interval: "15",
                timezone: "Pacific/Auckland",
                theme: "Dark",
                style: "1",
                locale: "en",
                toolbar_bg: "#f1f3f6",
                enable_publishing: false,
                hide_top_toolbar: true,
                allow_symbol_change: true,
                save_image: false,
                container_id: "tradingview_btc",
            });

            new TradingView.widget({
                autosize: true,
                symbol: "BINANCE:ETHUSDT",
                interval: "15",
                timezone: "Pacific/Auckland",
                theme: "Dark",
                style: "1",
                locale: "en",
                toolbar_bg: "#f1f3f6",
                enable_publishing: false,
                hide_top_toolbar: true,
                allow_symbol_change: true,
                save_image: false,
                container_id: "tradingview_eth",
            });

            new TradingView.widget({
                autosize: true,
                symbol: "BINANCE:ETHBTC",
                interval: "15",
                timezone: "Pacific/Auckland",
                theme: "Dark",
                style: "1",
                locale: "en",
                toolbar_bg: "#f1f3f6",
                enable_publishing: false,
                hide_top_toolbar: true,
                allow_symbol_change: true,
                save_image: false,
                container_id: "tradingview_ethbtc",
            });
        </script>
        <script type="text/javascript">
            var httpGetAsync = function (url, callback) {
                {
                    var xmlHttp = new XMLHttpRequest();
                    xmlHttp.onreadystatechange = function () {
                        if (xmlHttp.readyState == 4 && xmlHttp.status == 200)
                            callback(JSON.parse(xmlHttp.responseText));
                    };
                    xmlHttp.open("GET", url, true); // true for asynchronous
                    xmlHttp.send(null);
                }
            };

            var url = "https://blockchain.info/ticker?cors=true";

            var handleData = function (data) {
                var title = "$" + data["USD"]["last"] + " - BTC/USD";
                document.title = title;
            };

            setInterval(function () {
                httpGetAsync(url, handleData);
            }, 60000); // run every minute
        </script>
    </body>
</html>
